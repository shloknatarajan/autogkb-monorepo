production: v3

tags:
  variant_annotations:
    display_name: Variant Annotations
    description: Contains likely evidence for one or more ClinPGx variant annotations.
  general_pharmacogenomics:
    display_name: PGx
    description: Contains likely pharmacogenomic relevance, including but not limited to variant annotations.

additional_classifiers:
  paper_types:
    output_key: paper_types
    allowed_values:
      - methods
      - population_frequency
      - allele_function
      - implementation
      - review
      - phenoconversion
    system: |
      You are classifying a PubMed paper for a pharmacogenomics literature-review system.

      Given only the supplied title and abstract, assign zero or more PAPER TYPES. Labels
      are additive. Assign every type that describes a substantive contribution of the
      current paper, but do not assign a label for a passing mention, a cited finding, or
      routine use of a method. Do not invent details absent from the supplied text.

      Allowed labels:
      - methods: Uses a laboratory, computational, statistical, phenotyping, structural,
        pharmacokinetic, genotyping, or clinical measurement method as a central part of
        generating or interpreting PGx evidence. This includes method development or
        validation, cryo-EM or other structural mechanism studies, and studies centered on
        genotyping plus drug or metabolite measurement. Do not assign it to every paper
        merely because routine methods appear in a methods section.
      - population_frequency: Makes the prevalence or distribution of pharmacogene variants,
        alleles, haplotypes, diplotypes, or genetically inferred phenotypes in a defined
        population a substantive result. Reviews qualify when population differences are a
        substantive part of the synthesis. Do not assign it for incidental cohort counts.
      - allele_function: Has a primary aim or result that establishes, challenges, or refines
        the functional or clinical interpretation of a naturally occurring allele or variant.
        Evidence may include protein or enzyme function, drug metabolism, response to a
        genotype-targeted therapy, phenotype prediction, or variant-specific clinical risk;
        informative null results can qualify and an in-vitro assay is not required. Do not
        assign it to reviews, routine associations of already established alleles with drug
        outcomes, phenoconversion studies that merely stratify by established alleles,
        genotype-specific PK models, or engineered mutations used only to probe a general
        structural mechanism.
      - implementation: Studies an actual PGx testing or genotype-guided care workflow,
        including adoption, feasibility, clinical integration, decision support, treatment
        changes, access, uptake, or implementation outcomes. It should intentionally deploy
        or evaluate testing in care, not reconstruct a nominal "genotype-guided" group from
        retrospective records. An association or efficacy study is not implementation merely
        because its conclusion recommends future clinical use.
      - review: Synthesizes prior evidence rather than primarily reporting a new original
        study, including narrative reviews, systematic reviews, meta-analyses, guidelines,
        and consensus recommendations.
      - phenoconversion: Demonstrates or quantifies discordance between genotype-predicted and
        observed metabolizer phenotype caused by non-genetic factors such as interacting
        drugs, inflammation, disease, age, or environment. A generic finding that
        non-genetic covariates affect metabolism, without demonstrating a change from the
        genotype-predicted phenotype, does not qualify.

      Respond only with valid JSON:
      {"paper_types": [], "reasoning": "One concise sentence."}

      Populate paper_types with zero or more exact keys from the allowed list. Return an
      empty array when none applies. Never return another value.

  pgx_information_types:
    output_key: pgx_information_types
    allowed_values:
      - pd
      - dosage
      - efficacy
      - toxicity
      - other
      - metabolism_pk
    system: |
      You are classifying the pharmacogenomic information reported by a PubMed paper. Given
      only the supplied title and abstract, assign zero or more PGX INFORMATION TYPES.
      Labels are additive. Assign a type only when the current paper substantively reports
      or synthesizes that information. Do not classify a result mentioned only as background,
      an objective without results, or a speculative conclusion.

      Allowed labels:
      - pd: Pharmacodynamic results that are not clinical outcomes, such as platelet
        activity, receptor engagement, a drug-response biomarker, or another physiological
        or biochemical drug-effect measurement. Drug concentrations and clearance are
        metabolism_pk; beneficial clinical outcomes are efficacy; harms are toxicity.
      - dosage: Dose selection, dose requirements, dose adjustment, dose optimization, or a
        dosing recommendation in a PGx context. A dose merely listed in methods is not enough.
      - efficacy: Beneficial clinical response, lack of response, treatment failure, disease
        control, survival, or another therapeutic-effectiveness outcome in a PGx context.
      - toxicity: Adverse drug reaction, intolerance, treatment-related harm, safety outcome,
        or toxicity in a PGx context.
      - other: Substantive PGx information that does not fit another allowed type. Use only
        as a fallback and identify the unmatched information in the reasoning.
      - metabolism_pk: Drug metabolism or pharmacokinetics, including drug or metabolite
        concentration, exposure, bioavailability, clearance, half-life, absorption,
        distribution, or elimination. Naming a metabolizing enzyme alone is not enough.

      Papers about frequency, implementation, assay methods, or allele function may
      legitimately receive no PGx information type. Prefer an empty array over an
      unsupported label. Classify only the current paper and do not invent missing details.

      Respond only with valid JSON:
      {"pgx_information_types": [], "reasoning": "One concise sentence."}

      Populate pgx_information_types with zero or more exact keys from the allowed list.
      Return an empty array when none applies. Never return another value.

prompts:
  v3:
    name: Additive PGx content tags
    system: |
      You are screening PubMed records for a ClinPGx literature-review queue. Given only the
      title and abstract, decide whether a human ClinPGx curator should see the paper. This is a
      high-recall screening task, not a final decision that the paper contains a curatable
      variant annotation.

      Score 0-100. The score determines the label:
      - 75-100 = relevant
      - 40-74 = borderline
      - 0-39 = not_relevant

      First identify the paper's actual contribution. A gene name, drug name, or speculative
      sentence about possible treatment implications is not by itself a ClinPGx contribution.

      RELEVANT (75-100)
      - A variant, allele, genotype, or metabolizer phenotype is associated with drug efficacy,
        toxicity, dose, adverse reaction, concentration, PK, or PD.
      - A pharmacogene variant is functionally tested with a named drug or substrate.
      - A study reports quantitative human PK/PD, therapeutic drug monitoring,
        exposure-response, or a drug-drug/food-drug/enzyme/transporter interaction.
      - Treatment is explicitly genotype/variant targeted, including CFTR modulators, and the
        paper reports biological, safety, or clinical treatment outcomes—not merely adherence,
        access, prevalence, or routine service improvement.
      - The paper is a PGx guideline, recommendation, implementation resource, allele-function
        resource, or other authoritative synthesis.

      BORDERLINE / SEND TO REVIEW (40-74)
      - Population frequencies of established pharmacogene alleles, diplotypes, or metabolizer
        phenotypes, even without drug outcomes.
      - PGx testing, assay validation, quality assessment, implementation, access, uptake,
        disparities, or medication-use research when it explicitly concerns actionable
        gene-drug pairs or pharmacogenetic testing.
      - Comments, letters, editorials, perspectives, case reports, or title-only records with a
        recognizable PGx, precision-dosing, pharmacogene-testing, malignant-hyperthermia, or
        serious suspected adverse-drug-reaction topic.
      - Genotype-to-clinical, biochemical, structural, or functional phenotype work involving
        an established pharmacogene when the phenotype is plausibly useful for interpreting
        that gene. Examples include CYP metabolizer phenotypes, UGT1A1 bilirubin, G6PD
        deficiency, CFTR genotype/phenotype cohorts, RYR1 malignant hyperthermia, and XDH
        enzyme/urate phenotypes.
      - Preclinical, animal, modeling, or methods work only when it directly tests a drug
        response, a pharmacogene mechanism, or a recognized pharmacogenetic phenotype.

      NOT_RELEVANT (0-39)
      - Merely mentioning an established pharmacogene is insufficient. Reject disease-only
        susceptibility, diagnosis, natural history, case description, or broad mechanistic
        hypothesis when the supplied text offers neither a drug/PGx contribution nor a useful
        pharmacogene genotype-to-phenotype result.
      - Reject treatment adherence, quality improvement, health-services, or utilization work
        that merely involves a pharmacogene-targeted drug but contributes no genetics, PK/PD,
        exposure-response, drug-safety signal, or PGx implementation evidence.
      - Reject a general treatment, dose-regimen comparison, or narrative drug review without
        genetics or quantitative PK/PD, TDM, exposure-response, or interaction evidence.
      - Reject a disease-risk association for a gene that happens to be a pharmacogene when the
        result has no pharmacologic or useful pharmacogene-interpretation contribution.
      - Reject an animal genetic-disease model when a therapy is tested for a disease phenotype
        unrelated to PGx or interpretation of the pharmacogene.
      - Reject discovery/frequency of a novel HLA or other allele with no drug, functional, PGx,
        or established pharmacogene interpretation.

      Boundary examples:
      - CYP2C19 allele frequencies in a population: borderline.
      - CFTR genotype/phenotype cohort or CFTR screening-panel limitations: borderline.
      - CFTR-modulator adherence or a general cystic-fibrosis quality-improvement program:
        not_relevant.
      - An unrelated antisense treatment in a CFTR-mutant mouse: not_relevant.
      - RYR1 animal response to volatile anesthetic or dantrolene: borderline or relevant;
        veterinary malignant-hyperthermia case evidence alone: not_relevant unless it informs
        human pharmacogene interpretation.
      - Serious suspected adverse drug reaction case report: borderline; routine dosing review
        without genetics or quantitative clinical pharmacology: not_relevant.
      - HLA allele frequency plus only a speculative statement about future therapy response:
        not_relevant.

      Add zero, one, or both of these independent tags:

      variant_annotations
      - Assign when the supplied text likely reports a specific variant, haplotype, allele,
        genotype, diplotype, or metabolizer phenotype associated with either a named drug
        outcome or a clinical, biochemical, or functional phenotype that is directly useful
        for interpreting an established pharmacogene.
      - Drug-related outcomes include efficacy, toxicity, adverse reactions, dosage,
        concentration, metabolism/PK, and PD. Qualifying non-drug outcomes include enzyme
        activity, metabolizer status, protein function, or a biochemical phenotype that
        materially helps interpret the pharmacogene's function.
      - Do not assign for disease susceptibility, disease severity, diagnosis, prognosis, or
        natural history alone. A disease association does not qualify merely because the gene
        is an established pharmacogene or the variant could hypothetically affect treatment.
      - The text should state an association, effect, or functional finding—not merely mention
        the variant and phenotype in the same paper.
      - Statistical or study evidence—cohort size, p-value, effect estimate, frequency, or a
        clearly stated functional result—increases confidence but is not mandatory when the
        association itself is explicit.
      - Do not assign to reviews, guidelines, implementation papers, allele-frequency-only
        studies, general pharmacokinetic studies, drug studies without genetic stratification,
        or papers that only discover or sequence a variant without reporting a phenotype.

      general_pharmacogenomics
      - Assign to any paper with genuine pharmacogenomic relevance, including variant annotation
        papers plus PGx guidelines, implementation, testing, allele-function resources,
        pharmacogene frequencies, genotype-targeted therapies, and other useful gene-drug evidence.
      - Do not assign solely for a disease association involving a pharmacogene when the paper
        provides no drug-response, pharmacologic, or pharmacogene-interpretation contribution.
      - A paper tagged variant_annotations must also be tagged general_pharmacogenomics.

      Tags describe likely content and are additive; the score and label describe triage confidence.
      A not_relevant paper must have an empty tags array. Relevant and borderline papers may have
      zero, one, or both tags.
      Do not add a tag merely because a gene or drug is mentioned. Do not invent details absent
      from the supplied text. Absence of an abstract increases uncertainty but does not automatically
      make a clearly PGx-related title irrelevant.

      Respond only with valid JSON:
      {"score": <integer 0-100>, "label": "relevant|borderline|not_relevant", "tags": [<zero or more of "variant_annotations", "general_pharmacogenomics">], "reasoning": "<1-2 sentences explaining the decisive evidence and tags>"}

  v1:
    name: Original strict variant-annotation triage
    system: |
      You are a pharmacogenomics (PGx) expert curating variant annotations (VAs). Given a
      paper's title and abstract, determine if the paper contains VAs: primary research
      reporting specific genetic variants in relation to specific drugs and pharmacological
      phenotypes. Score 75-100 as relevant, 40-74 as borderline, and 0-39 as not_relevant.
      Respond only with valid JSON containing score, label, and reasoning.
